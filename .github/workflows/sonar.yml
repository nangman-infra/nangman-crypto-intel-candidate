name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Build ARM64 Docker image
        run: docker buildx build --platform linux/arm64 -t intel-candidate-app:ci .

  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate clippy report
        run: |
          mkdir -p sonar-reports
          cargo clippy --all-targets --message-format=json -- -D warnings > sonar-reports/clippy.json

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --lcov --output-path sonar-reports/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || secrets.SONAR_HOST_URL }}

      - name: Print Quality Gate Conditions
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          report_file=".scannerwork/report-task.txt"
          if [[ ! -f "$report_file" ]]; then
            echo "Sonar report task file is missing"
            exit 0
          fi

          server_url="$(sed -n 's/^serverUrl=//p' "$report_file")"
          ce_task_url="$(sed -n 's/^ceTaskUrl=//p' "$report_file")"
          task_json=""
          for _ in {1..60}; do
            task_json="$(curl -fsS -u "$SONAR_TOKEN:" "$ce_task_url")"
            task_status="$(jq -r '.task.status' <<<"$task_json")"
            case "$task_status" in
              SUCCESS) break ;;
              FAILED|CANCELED)
                echo "$task_json" | jq '{ceTaskStatus:.task.status, ceTaskError:.task.errorMessage}'
                exit 0
                ;;
            esac
            sleep 5
          done

          analysis_id="$(jq -r '.task.analysisId // empty' <<<"$task_json")"
          if [[ -z "$analysis_id" ]]; then
            echo "$task_json" | jq '{ceTaskStatus:.task.status}'
            exit 0
          fi

          curl -fsS -u "$SONAR_TOKEN:" \
            "$server_url/api/qualitygates/project_status?analysisId=$analysis_id" \
            | jq '{
                qualityGateStatus: .projectStatus.status,
                conditions: [
                  .projectStatus.conditions[]
                  | {metricKey, status, actualValue, errorThreshold, comparator}
                ]
              }'

          project_key="$(sed -n 's/^projectKey=//p' "$report_file")"
          curl -fsS -u "$SONAR_TOKEN:" \
            "$server_url/api/issues/search?componentKeys=$project_key&resolved=false&inNewCodePeriod=true&ps=50" \
            | jq '{
                newIssueCount: .total,
                issues: [
                  .issues[]
                  | {rule, severity, component, line, message}
                ]
              }'

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
