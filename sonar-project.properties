sonar.projectKey=nangman-crypto-intel-candidate
sonar.projectName=nangman-crypto-intel-candidate
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,scripts,ecs,schemas,asyncapi,policies,.github/workflows
sonar.tests=tests
sonar.exclusions=target/**,sonar-reports/**
sonar.coverage.exclusions=scripts/**,ecs/**,schemas/**,asyncapi/**,policies/**,.github/**,src/main.rs,src/bin/**,src/agent.rs,src/live.rs,src/storage.rs,src/worker.rs

sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enable=false
sonar.rust.clippy.reportPaths=sonar-reports/clippy.json
sonar.rust.lcov.reportPaths=sonar-reports/lcov.info
